<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background gradient: deep indigo to rich violet -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#312e81"/>
      <stop offset="50%"  stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Shield fill: indigo to violet -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%"   stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Blade shine -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Top highlight glow -->
    <radialGradient id="glow" cx="50%" cy="20%" r="60%">
      <stop offset="0%"   stop-color="#a5b4fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0"/>
    </radialGradient>

    <!-- Inner shadow for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1e1b4b" flood-opacity="0.5"/>
    </filter>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>

  <!-- Subtle top glow overlay -->
  <rect width="64" height="64" rx="14" fill="url(#glow)"/>

  <!-- Shield shape -->
  <path
    d="M32 8 L52 16 L52 34 C52 46 32 56 32 56 C32 56 12 46 12 34 L12 16 Z"
    fill="url(#shieldGrad)"
    filter="url(#shadow)"
    opacity="0.95"
  />

  <!-- Shield inner highlight (top edge gleam) -->
  <path
    d="M32 11 L49 18 L49 20 L32 13 L15 20 L15 18 Z"
    fill="white"
    opacity="0.18"
  />

  <!-- Shield inner border -->
  <path
    d="M32 12 L50 19.5 L50 34 C50 44.5 32 53.5 32 53.5 C32 53.5 14 44.5 14 34 L14 19.5 Z"
    fill="none"
    stroke="white"
    stroke-width="0.8"
    opacity="0.2"
  />

  <!-- Sword blade — tilted 45° for dynamism -->
  <g transform="translate(32,32) rotate(-45)" filter="url(#glow-filter)">
    <!-- Blade -->
    <rect x="-2" y="-18" width="4" height="24" rx="1.5" fill="url(#bladeGrad)"/>
    <!-- Tip -->
    <polygon points="-2,6 2,6 0,12" fill="#e0e7ff"/>
    <!-- Crossguard -->
    <rect x="-9" y="3" width="18" height="3.5" rx="1.75" fill="#c7d2fe"/>
    <!-- Handle -->
    <rect x="-1.5" y="6.5" width="3" height="7" rx="1" fill="#a5b4fc"/>
    <!-- Pommel -->
    <circle cx="0" cy="15" r="2.2" fill="#a5b4fc"/>
  </g>

  <!-- Subtle star sparkle top-right -->
  <g transform="translate(47,13)" opacity="0.7">
    <line x1="0" y1="-4" x2="0" y2="4" stroke="white" stroke-width="1" stroke-linecap="round"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="white" stroke-width="1" stroke-linecap="round"/>
    <line x1="-2.5" y1="-2.5" x2="2.5" y2="2.5" stroke="white" stroke-width="0.6" stroke-linecap="round"/>
    <line x1="2.5" y1="-2.5" x2="-2.5" y2="2.5" stroke="white" stroke-width="0.6" stroke-linecap="round"/>
  </g>
</svg>